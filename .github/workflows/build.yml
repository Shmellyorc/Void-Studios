name: Build VOID Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v6
        with:
          name: void-studio-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/studio/*.zip
            out/studio/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: void-studio-browser
          path: dist/VOID-Studio.html
          if-no-files-found: error
